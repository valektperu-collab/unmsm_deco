<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMSM - Simulacro DECO & Banco de Preguntas</title>
    <!-- Tailwind CSS para un diseño moderno y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-red-500">UNMSM <span class="text-white">Simulador DECO</span></h1>
            <span id="status-db" class="text-xs bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-2.5 py-1 rounded-full">Conectando a Supabase...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4 w-full flex-grow flex flex-col justify-center">
        
        <!-- Vista de Carga o Bienvenida -->
        <div id="app-container" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <div class="text-center py-8">
                <h2 class="text-2xl font-semibold mb-2">Preparación Examen de Admisión</h2>
                <p class="text-slate-400 mb-6">Banco de preguntas inteligente conectado a Supabase.</p>
                <button onclick="cargarPreguntas()" class="bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-2.5 rounded-lg transition-all shadow-lg shadow-red-600/20">
                    Cargar Preguntas
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-3 text-xs text-slate-500">
        Plataforma optimizada para despliegue en Netlify y Supabase
    </footer>

    <!-- Lógica de Conexión y Renderizado Interactivo -->
    <script>
        const SUPABASE_URL = 'https://mjyxpdtpnbrjxtbwtqgz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6jCQHTCU3n8xzUmvtpAvQQ_ntXFCjK-';
        
        let supabaseClient = null;
        let preguntaActual = null;

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            document.getElementById('status-db').innerText = 'Supabase Conectado';
            document.getElementById('status-db').className = 'text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full';
        } catch (e) {
            document.getElementById('status-db').innerText = 'Error de Conexión';
            document.getElementById('status-db').className = 'text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-full';
        }

        async function cargarPreguntas() {
            const container = document.getElementById('app-container');
            container.innerHTML = `<div class="text-center py-8"><p class="text-slate-400 animate-pulse">Obteniendo preguntas de la base de datos...</p></div>`;

            if (!supabaseClient) {
                container.innerHTML = `<p class="text-rose-400 text-center">Falta configurar las credenciales de Supabase en el código.</p>`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('banco_preguntas')
                .select('*')
                .limit(5);

            if (error) {
                container.innerHTML = `<p class="text-rose-400 text-center">Error al consultar: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p class="text-amber-400 text-center">No se encontraron preguntas en la tabla 'banco_preguntas'.</p>`;
                return;
            }

            preguntaActual = data[0];
            renderizarPregunta(preguntaActual);
        }

        function renderizarPregunta(p) {
            const container = document.getElementById('app-container');

            let opts = {};
            try {
                opts = typeof p.opciones === 'string' ? JSON.parse(p.opciones) : (p.opciones || {});
            } catch (err) {
                opts = {};
            }

            // Si no hay opciones en JSON, usamos las columnas individuales o texto por defecto
            const altA = opts.A || p.alternativa_a || 'Opción A';
            const altB = opts.B || p.alternativa_b || 'Opción B';
            const altC = opts.C || p.alternativa_c || 'Opción C';
            const altD = opts.D || p.alternativa_d || 'Opción D';
            const altE = opts.E || p.alternativa_e || 'Opción E';

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span class="bg-slate-700 px-2 py-1 rounded">Área ${p.area || 'A'} - ${p.curso || 'General'}</span>
                        <span>${p.tema || 'Modelo DECO'}</span>
                    </div>
                    <h3 class="text-lg font-medium text-white">${p.enunciado || 'Pregunta sin texto'}</h3>
                    
                <div class="space-y-2 mt-4" id="lista-opciones">
                    <div onclick="verificarRespuesta('A', this)" data-letra="A" class="opcion-btn p-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition select-none">A) ${altA}</div>
                    <div onclick="verificarRespuesta('B', this)" data-letra="B" class="opcion-btn p-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition select-none">B) ${altB}</div>
                    <div onclick="verificarRespuesta('C', this)" data-letra="C" class="opcion-btn p-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition select-none">C) ${altC}</div>
                    <div onclick="verificarRespuesta('D', this)" data-letra="D" class="opcion-btn p-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition select-none">D) ${altD}</div>
                    <div onclick="verificarRespuesta('E', this)" data-letra="E" class="opcion-btn p-3 bg-slate-700/50 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition select-none">E) ${altE}</div>
                     </div>                    


                        <div id="resultado-container" class="hidden mt-6 p-4 bg-slate-900/80 rounded-lg border border-slate-700 text-sm text-slate-300">
                        <strong id="texto-estado" class="block mb-1"></strong>
                        <strong>Fundamentación:</strong> <span id="texto-justificacion"></span>
                    </div>
                </div>
            `;
        }

        function verificarRespuesta(letraElegida, elemento) {
            if (!preguntaActual) return;

            // Desactivar clics en todas las opciones una vez seleccionada una
            const botones = document.querySelectorAll('.opcion-btn');
            botones.forEach(btn => btn.style.pointerEvents = 'none');

            const claveCorrecta = (preguntaActual.clave_correcta || '').trim().toUpperCase();
            const resultadoDiv = document.getElementById('resultado-container');
            const textoEstado = document.getElementById('texto-estado');
            const textoJustificacion = document.getElementById('texto-justificacion');

            resultadoDiv.classList.remove('hidden');
            textoJustificacion.innerText = preguntaActual.justificacion || preguntaActual.explicacion || 'Generada mediante Python y Google GenAI.';

            if (letraElegida === claveCorrecta) {
                elemento.className = "p-3 bg-emerald-600/30 border border-emerald-500 text-emerald-300 rounded-lg transition";
                textoEstado.innerHTML = "¡Respuesta Correcta! 🎉";
                textoEstado.className = "block mb-1 text-emerald-400 font-bold";
            } else {
                elemento.className = "p-3 bg-rose-600/30 border border-rose-500 text-rose-300 rounded-lg transition";
                textoEstado.innerHTML = `Respuesta Incorrecta. La clave correcta es la <strong>${claveCorrecta}</strong>.`;
                textoEstado.className = "block mb-1 text-rose-400 font-bold";

                // Resaltar la correcta
                botones.forEach(btn => {
                    if (btn.getAttribute('data-letra') === claveCorrecta) {
                        btn.className = "p-3 bg-emerald-600/30 border border-emerald-500 text-emerald-300 rounded-lg transition";
                    }
                });
            }
        }
    </script>
</body>
</html>
